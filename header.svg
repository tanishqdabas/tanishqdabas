<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" role="img" aria-label="Dreamscape: a violet night sky, a low glowing moon, mountain silhouettes and floating geometric shapes">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A0316"/>
      <stop offset="0.5" stop-color="#1A0E3F"/>
      <stop offset="1" stop-color="#2C1A63"/>
    </linearGradient>
    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
